<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<canvas id="c" width="1200" height="630"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');

// background
ctx.fillStyle = '#101717';
ctx.fillRect(0, 0, 1200, 630);

// side rules
ctx.strokeStyle = '#30403a';
ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(90.5, 0); ctx.lineTo(90.5, 630); ctx.stroke();
ctx.beginPath(); ctx.moveTo(1109.5, 0); ctx.lineTo(1109.5, 630); ctx.stroke();

const left = 120;

// monogram box
ctx.strokeStyle = '#e5bb69';
ctx.lineWidth = 2;
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
roundRect(left, 140, 64, 64, 14);
ctx.fillStyle = '#101717';
ctx.fill();
ctx.stroke();

ctx.fillStyle = '#e5bb69';
ctx.font = '700 26px Georgia, serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('KB', left + 32, 140 + 34);

ctx.fillStyle = '#93998f';
ctx.font = '20px Arial, sans-serif';
ctx.textAlign = 'left';
ctx.textBaseline = 'alphabetic';
ctx.fillText('krbahr.github.io', left + 84, 178);

// kicker
ctx.fillStyle = '#e5bb69';
ctx.font = '18px "IBM Plex Mono", Consolas, monospace';
ctx.letterSpacing = '3px';
ctx.fillText('PROJECTS · AI & LAW', left, 260);
ctx.letterSpacing = '0px';

// h1
ctx.fillStyle = '#f0f0e6';
ctx.font = '400 88px Georgia, serif';
ctx.fillText('Kyle Bahr', left - 3, 366);

// paragraph
ctx.fillStyle = '#93998f';
ctx.font = '30px Georgia, serif';
const text = 'Work on AI, legal practice, and the places they collide.';
ctx.fillText(text, left, 420);

window.__dataURL = document.getElementById('c').toDataURL('image/png');
</script>
</body>
</html>
